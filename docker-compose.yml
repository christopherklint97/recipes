services:
  app:
    # Host capacity guardrails (16 September 2026 incident).
    cpus: "1.0"
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build: .
    image: recipes:latest
    container_name: recipes
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3200:3000"
